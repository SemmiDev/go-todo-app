---
# ╔══════════════════════════════════════════════════════════════╗
# ║  Role: app — Build & Deploy todo-app                      ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Clone / Update Repository ────────────────────────────────
- name: Clone or update application repository
  git:
    repo: '{{ app_repo }}'
    dest: '{{ app_dir }}/src'
    version: '{{ app_branch }}'
    force: yes
    accept_hostkey: yes
  become_user: '{{ deploy_user }}'

# ── Generate .env File ──────────────────────────────────────
- name: Deploy environment file
  template:
    src: env.j2
    dest: '{{ app_dir }}/src/.env'
    owner: '{{ deploy_user }}'
    group: '{{ deploy_user }}'
    mode: '0600'

# ── Deploy Docker Compose ───────────────────────────────────
- name: Deploy application Docker Compose file
  template:
    src: docker-compose.yml.j2
    dest: '{{ app_dir }}/docker-compose-app.yml'
    owner: '{{ deploy_user }}'
    group: '{{ deploy_user }}'
    mode: '0644'

# ── Build Application Image ─────────────────────────────────
- name: Build Docker image
  command: docker compose -f docker-compose-app.yml build --no-cache
  args:
    chdir: '{{ app_dir }}'
  become_user: '{{ deploy_user }}'
  register: build_result
  changed_when: true

- name: Display build output
  debug:
    msg: '{{ build_result.stdout_lines[-10:] }}'
  when: build_result is defined

# ── Application Database Migrations (Placeholder) ───────────
# If using golang-migrate or similar later:
# - name: Run database migrations
#   command: docker run --rm --network gotodoapp_network -e DATABASE_URL={{ database_url }} migrate/migrate -path /migrations -database "{{ database_url }}" up
#   become_user: "{{ deploy_user }}"

# ── Deploy Application ──────────────────────────────────────
- name: Tag current image as rollback
  command: docker tag {{ app_name }}:latest {{ app_name }}:rollback
  become_user: '{{ deploy_user }}'
  ignore_errors: true
  changed_when: false

- name: Check if external gotodoapp_network exists
  command: docker network inspect gotodoapp_network
  register: network_check
  changed_when: false
  ignore_errors: true
  become_user: '{{ deploy_user }}'

- name: Create external Docker network for app and database isolation
  command: docker network create gotodoapp_network
  when: network_check.rc != 0
  become_user: '{{ deploy_user }}'

- name: Stop existing application container
  command: docker compose -f docker-compose-app.yml down
  args:
    chdir: '{{ app_dir }}'
  become_user: '{{ deploy_user }}'
  ignore_errors: true
  changed_when: false

- name: Deploy and Verify Application
  block:
    - name: Start application container
      command: docker compose -f docker-compose-app.yml up -d
      args:
        chdir: '{{ app_dir }}'
      become_user: '{{ deploy_user }}'
      register: compose_up
      changed_when: "'Created' in compose_up.stderr or 'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr"

    # ── Health Check ─────────────────────────────────────────────
    - name: Wait for application to start
      uri:
        url: 'http://127.0.0.1:{{ app_port }}'
        status_code: [200, 301, 302]
        timeout: 5
      register: health_check
      retries: 12
      delay: 5
      until: health_check.status in [200, 301, 302]

    - name: Display deployment status
      debug:
        msg: '✅ {{ app_name }} deployed successfully! Status: {{ health_check.status }}'
  rescue:
    - name: Rollback to previous image on failure
      command: docker tag {{ app_name }}:rollback {{ app_name }}:latest
      become_user: '{{ deploy_user }}'
      ignore_errors: true

    - name: Restart with rollback image
      command: docker compose -f docker-compose-app.yml up -d
      args:
        chdir: '{{ app_dir }}'
      become_user: '{{ deploy_user }}'

    - name: Fail the deployment
      fail:
        msg: '❌ Deployment failed health check. Application rolled back to previous version.'

# ── Cleanup Old Images ──────────────────────────────────────
- name: Remove dangling Docker images
  command: docker image prune -f
  become_user: '{{ deploy_user }}'
  changed_when: false

# ── Copy Utility Scripts ────────────────────────────────────
- name: Copy deployment scripts to server
  copy:
    src: '{{ playbook_dir }}/../scripts/{{ item }}'
    dest: '{{ app_dir }}/scripts/{{ item }}'
    owner: '{{ deploy_user }}'
    group: '{{ deploy_user }}'
    mode: '0755'
  loop:
    - backup-db.sh
    - restore-db.sh
    - health-check.sh
    - ssl-renew.sh
