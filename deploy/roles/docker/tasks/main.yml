---
# ╔══════════════════════════════════════════════════════════════╗
# ║  Role: docker — Install Docker CE & Compose Plugin          ║
# ╚══════════════════════════════════════════════════════════════╝

- name: Remove old Docker packages
  apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent

- name: Install Docker prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker CE
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Create Docker daemon config directory
  file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configure Docker daemon (log rotation, live-restore)
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "live-restore": true,
        "default-address-pools": [
          {"base": "172.80.0.0/16", "size": 24}
        ]
      }
    owner: root
    group: root
    mode: "0644"
  notify: restart docker

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Add users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users }}"

# ── Docker system prune cron ────────────────────────────────
- name: Setup weekly Docker cleanup cron
  cron:
    name: "Docker system prune"
    minute: "0"
    hour: "3"
    weekday: "0"
    job: "docker system prune -af --volumes --filter 'until=168h' > /dev/null 2>&1"
    user: root
