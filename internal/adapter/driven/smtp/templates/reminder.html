<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo Reminder</title>
  <style>
    body { margin:0; padding:0; background:#f4f6f9; font-family:'Segoe UI',Arial,sans-serif; }
    .wrapper { max-width:560px; margin:40px auto; background:#ffffff; border-radius:12px;
               box-shadow:0 4px 24px rgba(0,0,0,.08); overflow:hidden; }
    .header  { background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);
               padding:32px 40px; color:#fff; }
    .header h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:-.3px; }
    .header p  { margin:6px 0 0; opacity:.85; font-size:14px; }
    .body    { padding:36px 40px; }
    .todo-card { background:#f8f9ff; border:1.5px solid #e0e3ff; border-radius:10px;
                 padding:20px 24px; margin-bottom:24px; }
    .todo-title { font-size:18px; font-weight:600; color:#1e1b4b; margin:0 0 10px; }
    .meta       { display:flex; gap:12px; flex-wrap:wrap; }
    .badge { display:inline-block; padding:3px 10px; border-radius:999px;
             font-size:12px; font-weight:600; text-transform:uppercase; }
    .badge-low    { background:#dcfce7; color:#166534; }
    .badge-medium { background:#fef9c3; color:#854d0e; }
    .badge-high   { background:#fee2e2; color:#991b1b; }
    .due-date { font-size:13px; color:#dc2626; font-weight:600; margin-top:12px; }
    .cta { text-align:center; margin-top:8px; }
    .cta a { display:inline-block; background:#6366f1; color:#fff; text-decoration:none;
             padding:12px 28px; border-radius:8px; font-weight:600; font-size:14px; }
    .cta a:hover { background:#4f46e5; }
    .footer { padding:20px 40px; text-align:center; font-size:12px; color:#94a3b8;
              border-top:1px solid #f1f5f9; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>⏰ Reminder: Todo Due Soon</h1>
      <p>Hi {{.UserName}}, don't let this slip through!</p>
    </div>
    <div class="body">
      <div class="todo-card">
        <div class="todo-title">{{.TodoTitle}}</div>
        {{if .TodoDescription}}
        <p style="color:#64748b;font-size:14px;margin:0 0 10px;">{{.TodoDescription}}</p>
        {{end}}
        <div class="meta">
          <span class="badge badge-{{.Priority}}">{{.Priority}}</span>
        </div>
        <div class="due-date">📅 Due: {{.DueDate}}</div>
      </div>
      <div class="cta">
        <a href="{{.AppURL}}">Open Todo App →</a>
      </div>
    </div>
    <div class="footer">
      You received this reminder because this todo is due within 24 hours.<br/>
      © Todo App — keep crushing it 🚀
    </div>
  </div>
</body>
</html>
